name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and lint (HA ${{ matrix.home-assistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        home-assistant: ["2026.8.0", "2026.9.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: >-
          python -m pip install
          "homeassistant==${{ matrix.home-assistant }}"
          -r requirements_test.txt
      - name: Compile
        run: python -m compileall -q custom_components scripts tests
      - name: Ruff lint
        run: ruff check .
      - name: Pytest
        run: pytest --cov=custom_components.llama_cpp_ai_task --cov-report=term-missing

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  release-consistency:
    name: Release consistency
    runs-on: ubuntu-latest
    # A release workflow first atomically pushes its version commit + tag, then
    # publishes the GitHub Release. Skip only that transient bot commit; the
    # release event and scheduled CI perform the strict consistency check.
    if: >-
      github.event_name != 'pull_request' &&
      !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v'))
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Compare manifest to newest published GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_release_consistency.py --allow-no-release
