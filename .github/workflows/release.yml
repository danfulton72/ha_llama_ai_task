name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (X.Y.Z)"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    # Automatic releases run only after a successful push-triggered CI on main.
    # Scheduled/manual/release-event CI runs must never create a release.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Resolve release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="$(python scripts/release.py normalize "${REQUESTED_VERSION}")"
          else
            # GitHub Release is the version authority. In the normal case the
            # manifest is first verified against the published release below,
            # then its patch component is incremented. If a previous run pushed
            # the version commit/tag but failed before publishing the release,
            # reuse that manifest version so the workflow can recover.
            CURRENT="$(python scripts/release.py get)"
            CURRENT_TAG="v${CURRENT}"
            if ! gh release view "${CURRENT_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 \
              && git ls-remote --exit-code --tags origin "refs/tags/${CURRENT_TAG}" >/dev/null 2>&1; then
              echo "Found ${CURRENT_TAG} tag without a GitHub Release; recovering it."
              VERSION="${CURRENT}"
            else
              VERSION="$(python scripts/release.py next-patch)"
            fi
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Inspect requested tag
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "${TAG} is already a published GitHub Release" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Existing tag ${TAG} found without a GitHub Release; entering recovery mode."
            git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
            git checkout "${TAG}"
            python scripts/release.py check-tag "${TAG}"
            echo "recovery=true" >> "${GITHUB_OUTPUT}"
          else
            echo "recovery=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Validate current released state
        if: steps.state.outputs.recovery != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_release_consistency.py

      - name: Validate version increment
        if: steps.state.outputs.recovery != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CURRENT="$(python scripts/release.py get)"
          python - "${CURRENT}" "${VERSION}" <<'PY'
          import sys

          current = tuple(map(int, sys.argv[1].split(".")))
          requested = tuple(map(int, sys.argv[2].split(".")))
          if requested <= current:
              raise SystemExit(
                  f"Requested version {sys.argv[2]} must be greater than current {sys.argv[1]}"
              )
          PY

      - name: Synchronize manifest from release version
        if: steps.state.outputs.recovery != 'true'
        run: python scripts/release.py set "${{ steps.version.outputs.version }}"

      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Quality gates
        run: |
          python -m compileall -q custom_components scripts tests
          ruff check .
          pytest

      - name: Commit version and create tag
        if: steps.state.outputs.recovery != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/llama_cpp_ai_task/manifest.json
          if git diff --cached --quiet; then
            echo "manifest.json did not change for ${VERSION}" >&2
            exit 1
          fi
          git commit -m "Release ${TAG}"
          git tag -a "${TAG}" -m "${TAG}"
          git push --atomic origin HEAD:main "refs/tags/${TAG}"

      - name: Build release archive
        shell: bash
        run: |
          # hacs.json sets `zip_release` with this exact filename, so the asset
          # name is constant and the archive holds integration files at its root.
          mkdir -p dist
          (cd custom_components/llama_cpp_ai_task && zip -qr "${GITHUB_WORKSPACE}/dist/llama_cpp_ai_task.zip" .)
          (cd dist && sha256sum llama_cpp_ai_task.zip > llama_cpp_ai_task.zip.sha256)

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          EXTRA=()
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${PRERELEASE}" == "true" ]]; then
            EXTRA+=(--prerelease)
          fi
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${TAG}" \
            --generate-notes \
            "${EXTRA[@]}" \
            dist/llama_cpp_ai_task.zip \
            dist/llama_cpp_ai_task.zip.sha256

      - name: Verify published release consistency
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/release.py check-tag "${{ steps.version.outputs.tag }}"
          python scripts/check_release_consistency.py
